name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymem pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name acs2 acs2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: acs2-exe
          path: dist/acs2.exe
